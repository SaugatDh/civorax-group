# Builds the site and uploads it to cPanel hosting on every push to main.
# Required repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.civoraxgroup.com
#   FTP_USERNAME  the cPanel FTP account, e.g. deploy@civoraxgroup.com
#   FTP_PASSWORD  that account's password
name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual "Run workflow" button

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          # The FTP account's home folder is the site root (public_html), so upload to ./
          server-dir: ./
          # Only changed files are uploaded; a state file on the server tracks them.
